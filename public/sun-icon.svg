<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Sun Rays & Disc -->
  <circle cx="50" cy="40" r="24" fill="url(#sunGrad)" />
  <g stroke="#F59E0B" stroke-width="4" stroke-linecap="round">
    <line x1="50" y1="8" x2="50" y2="2" />
    <line x1="74" y1="16" x2="79" y2="12" />
    <line x1="84" y1="38" x2="90" y2="38" />
    <line x1="16" y1="38" x2="10" y2="38" />
    <line x1="26" y1="16" x2="21" y2="12" />
  </g>
  <!-- Solar Panel / Kaushal Roof Base -->
  <polygon points="12,85 88,85 76,55 24,55" fill="url(#panelGrad)" stroke="#60A5FA" stroke-width="2" />
  <!-- Panel Grid Lines -->
  <line x1="50" y1="55" x2="50" y2="85" stroke="#93C5FD" stroke-width="1.5" />
  <line x1="18" y1="70" x2="82" y2="70" stroke="#93C5FD" stroke-width="1.5" />
  <line x1="36" y1="55" x2="30" y2="85" stroke="#93C5FD" stroke-width="1.5" />
  <line x1="64" y1="55" x2="70" y2="85" stroke="#93C5FD" stroke-width="1.5" />
</svg>

